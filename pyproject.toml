[project]
name = "erdos-frontier"
version = "0.1.0"
description = "A formal-proof fidelity audit over the Erdős frontier: which 'solved' problems rest on an unconditional Lean proof, and which silently assume an unproven result."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  # Writes and checks `sources.lock.json`. A dev dependency rather than a
  # runtime one: nothing in `erdos_frontier.py` locks sources any more, so the
  # only code here that imports it is the test that holds it to this Frontier's
  # declaration shapes. Acquisitions run it as a tool, not as a library:
  #     uvx --from "git+https://github.com/vela-science/vela@3eacefceea2c76d8809d93f5805bff9bf5e5752c#subdirectory=packages/vela-source-manifest" vela-source-lock
  "vela-source-manifest>=1.0",
]

[tool.uv.sources]
# A git rev rather than a released version because the package is not on PyPI
# yet; the rev is immutable, so this resolves from a checkout of this repository
# alone rather than only where the vela repository happens to sit beside it.
vela-source-manifest = { git = "https://github.com/vela-science/vela", rev = "3eacefceea2c76d8809d93f5805bff9bf5e5752c", subdirectory = "packages/vela-source-manifest" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

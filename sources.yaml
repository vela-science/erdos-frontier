# The sources this frontier reconciles. `sources.lock.json` records the exact
# content hash (and GitHub commit, where resolvable) of each at generation time,
# so accepted state is traceable to exact snapshots rather than a floating `main`
# (memo Gate 1 / Failure Mode 4). Regenerate the lock with:
#     uvx --from "git+https://github.com/vela-science/vela@73d278b0020b1699fcf80749104db19860d1bec2#subdirectory=packages/vela-source-manifest" vela-source-lock
# and check the committed one, without the network, with `--check`.
#
# The generator is the shared `vela-source-manifest` package, which lives at
# `packages/vela-source-manifest` in the vela repository and is declared in this
# repository's pyproject. It used to be a function in `erdos_frontier.py`, and a
# separate copy of a wider resolver in each sibling Frontier's `scripts/`; two
# implementations of one concept across four repositories is two things that can
# disagree while every lock still looks consistent. The pin is a git rev rather
# than a released version because the package is not on PyPI yet; the rev is
# immutable, so the invocation above resolves the same bytes anywhere.
#
# Regenerating is a deliberate act rather than a side effect of running
# `erdos_frontier.py`, so the lock only moves when someone means to move it.
# It was last regenerated on 2026-08-06, against the shared resolver; before
# that it had stood since the 2026-07-22 acquisition, long enough that it no
# longer described this file. What a regeneration changes is the acquisition
# pin, not the standing of anything resting on it: a Claim is bound to the
# Verification Record that established it, and that record names the bytes it
# ran on. Refreshing an entry here therefore records what upstream serves now
# and leaves the accepted record undisturbed. What it must never do is close a
# gap by hand — every hash in the lock is computed from bytes the resolver
# fetched, which is why the fix for a `--check` failure is to run the generator
# again, never to edit the lock to agree with it.
#
# `source_id` is the identifier the release-scoped source registry publishes
# this entry under, or null where the entry is frontier-derived and publishes
# under none. It belongs here rather than in a mapping table downstream: a
# consumer that has to be told which of its own ids matches which of our keys
# is a consumer that can disagree with us silently.
sources:
  erdos:
    source_id: source:erdos-problems
    kind: problem_registry
    repo: teorth/erdosproblems
    ref: main
    path: data/problems.yaml
    url: https://raw.githubusercontent.com/teorth/erdosproblems/main/data/problems.yaml

  formal_conjectures:
    source_id: source:formal-conjectures
    kind: formal_statement_registry
    repo: google-deepmind/formal-conjectures
    # There is no revision to pin. `data/conjectures.json` is not tracked in the
    # upstream repository at any ref; the GitHub Pages workflow builds it from
    # `main` and publishes it at the url below, so the bytes cannot be re-fetched
    # from a commit. `pages_commit` is the commit of the active github-pages
    # deployment, resolved from the deployment API on 2026-08-05. The lock's
    # content hash is the real pin, which is why this entry locks a sha256 and
    # no commit while every fetchable entry here locks both.
    pages_commit: 4c3577432c87a34761963b04c20aba2ac7e2efd2
    pages_commit_resolved: 2026-08-05T21:22:46Z
    url: https://google-deepmind.github.io/formal-conjectures/data/conjectures.json

  plby:
    source_id: source:plby-lean-proofs
    kind: proof_manifest
    repo: plby/lean-proofs
    ref: main
    path: data/sources.yaml
    url: https://raw.githubusercontent.com/plby/lean-proofs/main/data/sources.yaml

  jayyhk:
    source_id: source:jayyhk-erdos-lean
    kind: proof_manifest
    repo: Jayyhk/erdos-lean
    ref: main
    path: data/problems.yaml
    url: https://raw.githubusercontent.com/Jayyhk/erdos-lean/main/data/problems.yaml

  williamjblair_lean_proofs:
    source_id: source:williamjblair-lean-proofs
    kind: proof_manifest
    repo: williamjblair/lean-proofs
    ref: main
    path: proofs.yaml
    url: https://raw.githubusercontent.com/williamjblair/lean-proofs/main/proofs.yaml

  # Cited, not acquired. The fidelity artifacts and the astra-fidelity targets
  # reference the OpenAI comparator corpus; its bytes are acquired by the
  # formal-conjectures frontier. The commit and tree are restated here rather
  # than left to the sibling repository, because a reader who only has this file
  # would otherwise get a bare repository url where the registry has a pin.
  openai_ten_proofs:
    source_id: source:openai-ten-proofs
    kind: formal_library
    repo: openai/ten-proofs
    commit: 94bc0feb6a9ff12c7d31d6de640a725c9d43d2b6
    tree: 174289e4d4958cb0509874e6e53400e098213de7
    url: https://github.com/openai/ten-proofs
    acquired_by: formal-conjectures

  # Retained historical attestations used only by the source-audit join. Current
  # scientific Standing is represented by canonical Vela Claims and Decisions.
  fidelity:
    source_id: null
    kind: frozen_snapshot
    path: sources/fidelity_cache.json

  # Committed frozen snapshots, versioned in-repo (no live fetch).
  wiki:
    source_id: source:erdos-ai-contributions-wiki
    kind: frozen_snapshot
    repo: teorth/erdosproblems.wiki
    commit: c8ad4309d20120c67cb97faa86daa1443acee018
    path: sources/wiki/registry.json
    paths: [AI-contributions-to-Erdős-problems.md]
    note: the retired AI-contributions wiki (frozen 2026-06-30)
  gpt_erdos:
    source_id: source:gpt-erdos
    kind: frozen_snapshot
    repo: neelsomani/gpt-erdos
    commit: 21b48ae6b97279e9fe6781e3744e1cdd835e2cc1
    path: sources/gpt_erdos/registry.json
    paths: [README.md]

name: Verify current Vela repository

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: vela-science/vela@4de04a553f139911b3c061883f60d9734f73c0f2 # v0.940.9
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          frontier: .
          vela-version: v0.940.9
          authority-record-root: ${{ vars.VELA_AUTHORITY_RECORD_ROOT }}

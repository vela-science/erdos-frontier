name: Verify current Vela repository

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: vela-science/vela@9b62605d888af3ed4b6e53519dc664010084832f # v0.940.5
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          frontier: .
          vela-version: v0.940.5
          authority-record-root: ${{ vars.VELA_AUTHORITY_RECORD_ROOT }}

name: Verify current Vela repository

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: vela-science/vela@c4023f111ee88f92e6e3c7b47699499a46e83940 # v0.966.4
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          frontier: .
      - name: Check out the exact source-local Lean replay contract
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: vela-science/vela
          ref: 051b4d5123dad53aaf49e1123cef61f433551fbf
          path: .contract-source/vela
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: "3.13"
      # The whole suite, not the one file that used to run here. The consumer
      # test is inside it and still gets its contract path; what changes is that
      # the other 128 tests stop being written for a runner nobody starts.
      - name: Frontier test suite
        env:
          VELA_LEAN_REPLAY_CONTRACT: ${{ github.workspace }}/.contract-source/vela/research/lean-replay-contract
        run: uv run --locked --group dev pytest -q

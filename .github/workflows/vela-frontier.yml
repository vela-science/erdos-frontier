name: Verify current Vela repository

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: vela-science/vela@50ab6f267cf325988e6d903ddafa5c0070c9f015 # v0.963.0
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          frontier: .

name: Verify current Vela repository

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: vela-science/vela@1b051d62bdbd8358c76071e5cfdfb19baf33e2d8 # v0.940.0
        with:
          frontier: .
          vela-version: v0.940.0
          authority-record-root: ${{ vars.VELA_AUTHORITY_RECORD_ROOT }}

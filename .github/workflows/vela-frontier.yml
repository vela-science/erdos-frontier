name: Verify current Vela repository

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      # v0.966.2 ships an action.yml that still invokes `vela check`, a verb its own
      # binary rejects, so the newest release that verifies at all is v0.966.1.
      - uses: vela-science/vela@bf11bc02651c014cd6dd5bf23adf8c651e79559b # v0.966.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          frontier: .
      - name: Check out the exact source-local Lean replay contract
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: vela-science/vela
          ref: 051b4d5123dad53aaf49e1123cef61f433551fbf
          path: .contract-source/vela
      - name: Verify the exact package root as the Erdős consumer
        env:
          VELA_LEAN_REPLAY_CONTRACT: ${{ github.workspace }}/.contract-source/vela/research/lean-replay-contract
        run: python3 tests/test_lean_replay_contract_consumer.py

name: Re-audit Lean proofs (heavy)

# The HEAVY half of the split: clone + build the proof repos at their own Lean
# toolchains, re-run the assumption-extractor, and commit the retained audit
# evidence. No routine job republishes a parallel site or graph snapshot.
#
# Manual (workflow_dispatch). It builds TWO Mathlib toolchains from scratch: a
# validated dispatch reached [8346/8353] of the plby build (`lake exe cache get`
# fetched the Mathlib oleans fine) — the logic is sound, it just needs ~2h per
# toolchain, so the whole job runs ~4h cold. The fast, reliable path is LOCAL:
# with the proof repos cloned + built, `bash lean/reaudit.sh` finishes in minutes.
# Don't run this right before an external comms moment — if a locked commit moved
# since the last local audit, it will commit changed feeds (which is the point,
# just review them).
on:
  workflow_dispatch: {}

permissions:
  contents: write

# Share the daily job's group so the two never push to main concurrently.
concurrency:
  group: commit-to-main
  cancel-in-progress: false

jobs:
  reaudit:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # ~4h cold (two toolchains built from scratch) + margin
    steps:
      # The persisted credential is what "Commit regenerated feeds if changed"
      # pushes with. This is the one job here that writes to main, which is why
      # it shares the `commit-to-main` concurrency group above.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 # zizmor: ignore[artipacked]

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Cache only the elan toolchains (modest, conflict-free). Mathlib oleans come
      # from `lake exe cache get`; the proof files themselves compile each run.
      # NOT caching proof-repos/.lake — it would be restored before the clone and
      # make `git clone` fail on a non-empty dir.
      - name: Cache the Lean toolchains
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-v1
          restore-keys: elan-${{ runner.os }}-

      # Both the repository and the commit come from sources.lock.json, which is
      # what makes this an audit OF the declared sources rather than of whatever
      # three default branches happened to say. See lean/clone-at-lock.sh; it
      # fails the job if a checkout does not land on the pinned commit.
      - name: Check out the declared proof repos at their locked commits
        run: |
          mkdir -p proof-repos
          bash lean/clone-at-lock.sh plby proof-repos/plby
          bash lean/clone-at-lock.sh alphaproof proof-repos/alphaproof
          bash lean/clone-at-lock.sh jayyhk proof-repos/jayyhk

      # Build ONLY the ErdosProblems library (the aggregate ErdosProblems.All), not
      # the repository's default "All" target — that also pulls HundredTheorems /
      # MathOverflow / PrimeNumberTheoremAnd, which the extractor never reads and
      # which only add build time and failure surface.
      - name: Build plby ErdosProblems (Lean 4.29.1)
        working-directory: proof-repos/plby/src/v4.29.1
        run: |
          lake exe cache get || true
          lake build ErdosProblems.All

      - name: Build alphaproof-nexus (Lean 4.27.0)
        working-directory: proof-repos/alphaproof
        run: |
          lake exe cache get || true
          lake build APNOutputs

      # Jayyhk hosts one lake project per problem, each pinned to its own toolchain.
      # Build only the groups whose toolchain we already provisioned above (v4.29.1
      # for plby, v4.27.0 for alphaproof) so the Mathlib downloads are reused. The
      # other ~10 toolchain groups are a heavier, incremental follow-on.
      - name: Build Jayyhk groups matching plby/alphaproof (v4.29.1, v4.27.0)
        run: JAYYHK="$GITHUB_WORKSPACE/proof-repos/jayyhk" bash lean/build-jayyhk.sh v4.29.1 v4.27.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
      # uv's version is pinned, not just the action's. uv.lock carries a format
      # `revision`, and the resolver writes whichever revision its own build
      # declares: 0.7.x writes 2, 0.9.0 and later write 3. This lock is at 3, so
      # an unpinned uv that happened to be older would rewrite it a format
      # backwards and the job would commit that downgrade as if it were a result.
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.11.32"
      - run: uv sync --all-groups

      - name: Run the multi-toolchain audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VELA_PROOF_REPO: ${{ github.workspace }}/proof-repos/plby/src/v4.29.1
          VELA_PROOF_REPO_ALPHAPROOF: ${{ github.workspace }}/proof-repos/alphaproof
          VELA_PROOF_REPO_JAYYHK: ${{ github.workspace }}/proof-repos/jayyhk
        run: |
          uv run python lean/extract_assumptions.py --repo plby
          uv run python lean/extract_assumptions.py --repo alphaproof
          uv run python lean/extract_assumptions.py --repo jayyhk
          uv run python erdos_frontier.py
          uv run pytest -q

      - name: Commit regenerated feeds if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # sources.lock.json is not a regenerated feed and is deliberately not
          # staged here. Its live-fetched pins record what upstream served when
          # the Claims resting on them were accepted; a nightly re-audit that
          # refreshed them would overwrite that evidence with today's `main`.
          # Regenerate it deliberately, with `vela-source-lock`, when an
          # acquisition actually happens.
          git add lean/audit_feed*.json
          if git diff --staged --quiet; then
            echo "Audit feeds unchanged."
          else
            git commit -m "chore: re-audit proofs ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main || true
            git push
          fi
